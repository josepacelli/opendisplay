[package]
name = "core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "windows-core: the elevated OpenDisplay Windows sender workhorse (transport, capture, encode, input)."

[dependencies]
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned per design.md's Risks & Concerns ("pin a known-good version,
# monitor upstream" — mdns-sd is a pure-Rust DNS-SD implementation, no
# system Bonjour/mDNSResponder needed on Windows).
mdns-sd = "0.11"
# Pinned per design.md's Risks & Concerns ("idevice is a young, independent
# pure-Rust reimplementation... pin a known-good version, monitor upstream").
idevice = "0.1"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    # Added by T16 (display::create/resize/destroy): resolving and opening
    # opendisplay-idd's device interface and issuing its IOCTLs.
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    # Added by T17 (capture::start): DXGI Desktop Duplication + the D3D11
    # device it captures GPU textures through.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
