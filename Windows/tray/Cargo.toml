[package]
name = "tray"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "windows-tray: the unprivileged OpenDisplay Windows sender tray UI."

[dependencies]
# Added by T24 (ipc::connect client): the tray<->core message schema.
ipc = { path = "../ipc" }

[target.'cfg(windows)'.dependencies]
# Added by T25 (tray icon + device picker UI): Shell_NotifyIcon + popup
# menu rendering for the tray icon.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Added by FIX6 (windows-tray main()): GetModuleHandleW, to register
    # the hidden message-only window the tray icon and its message loop
    # are anchored to.
    "Win32_System_LibraryLoader",
    # WNDCLASSW's hbrBackground field is HBRUSH (Win32_Graphics_Gdi), even
    # though this window paints nothing.
    "Win32_Graphics_Gdi",
] }
